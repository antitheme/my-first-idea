<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘도 힘내세요!</title>
    <!-- 폰트 적용: 구글 Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
            font-weight: 400;
            /* 본문 기본 일반 굵기 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* 3구역 세로 배치 */
            /* 메인/보조 연녹색 테마 배경 */
            background: linear-gradient(135deg, #f4f9f7 0%, #e2efe6 100%);
            color: #1f4e3d;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* 3구역: 헤더레이아웃 추가 */
        header {
            width: 100%;
            background: #a3d9b1;
            /* 메인 색상: 연한 녹색 배경 */
            color: #1f4e3d;
            /* 보조 색상: 어두운 녹색 텍스트 */
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            /* 로고와 메뉴를 양쪽으로 분리 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 100;
        }

        header .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            /* 아이콘과 텍스트 사이 정갈한 간격 */
            font-size: 1.6rem;
            font-weight: 700;
            /* 제목은 굵게 */
            letter-spacing: -0.02em;
            cursor: pointer;
        }

        header .logo svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            /* 텍스트와 동일한 색상(어두운 숲색) 적용 */
        }

        header .nav-menu {
            display: flex;
            gap: 2.5rem;
            /* 메뉴들 사이의 넉넉하고 적당한 간격 */
            align-items: center;
        }

        header .nav-menu a {
            color: #1f4e3d;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 400;
            /* 본문 일반 굵기 */
            opacity: 0.85;
            transition: all 0.2s ease-in-out;
        }

        header .nav-menu a:hover {
            opacity: 1;
            text-shadow: 0 0 8px rgba(31, 78, 61, 0.3);
        }

        /* 3구역: 본문 레이아웃 수정 */
        main {
            flex: 1;
            /* 중간 영역을 채워 헤더, 푸터 위/아래 밀어냄 */
            display: flex;
            flex-direction: column;
            /* 여러 섹션을 세로 방향으로 쌓기 위함 */
            align-items: center;
            position: relative;
            width: 100%;
        }

        /* 첫 번째 섹션: 핵심 기능 소개 (기존 컨테이너 영역) */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* 배경의 둥근 원(circle)들이 밖으로 나가지 않게 함 */
        }

        /* 두 번째 섹션: 사용자 후기 영역 */
        .testimonial-section {
            width: 100%;
            padding: 6rem 2rem;
            background: #ffffff;
            /* 하얀색 배경으로 위의 히어로 영역과 확실히 구분 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .testimonial-section h2 {
            font-size: 2.2rem;
            font-weight: 700;
            /* 제목은 굵게 */
            color: #1f4e3d;
            margin-bottom: 0.5rem;
        }

        .testimonial-section .section-subtitle {
            font-size: 1.1rem;
            color: #4f6d61;
            margin-bottom: 4rem;
        }

        .testimonial-grid {
            display: flex;
            gap: 2.5rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
        }

        .testimonial-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .testimonial-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1.5rem;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .quote-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #4a5568;
            margin-bottom: 1.5rem;
            flex-grow: 1;
            /* 카드 내용 균일하게 늘리기 */
        }

        .author-name {
            font-weight: 400;
            /* 본문 일반 굵기 */
            font-size: 1.15rem;
            color: #2d3748;
        }

        /* 3구역: 푸터 레이아웃 추가 */
        footer {
            width: 100%;
            background: #c8e0d1;
            /* 배경과 어울리는 녹색톤 회색 */
            color: #1f4e3d;
            text-align: center;
            padding: 1rem;
            font-size: 0.95rem;
            font-weight: 400;
            /* 본문 일반 굵기 */
            position: relative;
            z-index: 100;
        }

        /* 둥둥 떠다니는 장식용 배경 요소 - 녹색 테마 */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            animation: float 10s infinite ease-in-out alternate;
        }

        .circle-1 {
            width: 450px;
            height: 450px;
            /* 연녹색 테마에 어울리는 부드러운 그린 톤 */
            background: linear-gradient(135deg, rgba(163, 217, 177, 0.6) 0%, rgba(226, 239, 230, 0.4) 100%);
            top: -100px;
            left: -100px;
        }

        .circle-2 {
            width: 350px;
            height: 350px;
            /* 대비를 주는 약간 짙은 녹색 톤 */
            background: linear-gradient(120deg, rgba(209, 227, 214, 0.8) 0%, rgba(136, 201, 153, 0.3) 100%);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        /* 글래스모피즘 컨테이너 */
        .container {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 6rem 8rem;
            border-radius: 30px;
            box-shadow: 0 10px 40px 0 rgba(31, 38, 135, 0.1);
            text-align: center;
            z-index: 2;

            /* 초기 애니메이션 상태 */
            transform: translateY(30px);
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
        }

        .container:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 50px 0 rgba(31, 38, 135, 0.15);
        }

        h1 {
            /* 폰트 크기 40px 및 보조 색상(어두운 녹색) 텍스트 적용 */
            font-size: 40px;
            font-weight: 700;
            /* 제목은 굵게 */
            letter-spacing: -0.01em;
            color: #1f4e3d;
            text-shadow: 0 4px 15px rgba(31, 78, 61, 0.1);
            /* 텍스트가 묻히지 않도록 미세한 입체감 */
            margin-bottom: 1.5rem;
            white-space: nowrap;
            transition: opacity 0.2s ease-in-out;
        }

        p {
            font-size: 1.5rem;
            font-weight: 400;
            /* 본문 일반 굵기 */
            letter-spacing: -0.01em;
            color: #4a5568;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.6s forwards;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(1);
            }

            100% {
                transform: translateY(60px) scale(1.1);
            }
        }

        /* 버튼 및 인터랙티브 스타일 추가 */
        .btn {
            margin-top: 2.5rem;
            padding: 1rem 3rem;
            font-size: 1.25rem;
            font-weight: 400;
            /* 본문 일반 굵기 */
            color: #ffffff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background-size: 200% auto;
            /* 부드러운 그라데이션 전환을 위한 사이즈 확대 */
            background-position: left center;
            position: relative;
            overflow: hidden;
            opacity: 0;
            /* 위로 부드럽게 나타나는 애니메이션 (0.8초 딜레이) */
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
            outline: none;
            z-index: 10;
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.05);
            /* 커지는 효과 */
            background-position: right center;
            /* 스르륵 색상 변경 */
        }

        .btn:active {
            transform: translateY(2px) scale(0.98);
            /* 클릭 시 쏙 들어가는 효과 */
        }

        /* 버튼 동적 색상 테마들 (클릭 시 변경) - 200% 그라데이션 적용 */
        .theme-blue {
            background-image: linear-gradient(to right, #0052D4 0%, #4364F7 51%, #0052D4 100%);
            box-shadow: 0 10px 20px rgba(67, 100, 247, 0.3);
        }

        .theme-blue:hover {
            box-shadow: 0 15px 30px rgba(67, 100, 247, 0.5);
        }

        .theme-yellow {
            background-image: linear-gradient(to right, #FDC830 0%, #F37335 51%, #FDC830 100%);
            box-shadow: 0 10px 20px rgba(243, 115, 53, 0.3);
        }

        .theme-yellow:hover {
            box-shadow: 0 15px 30px rgba(243, 115, 53, 0.5);
        }

        .theme-orange {
            background-image: linear-gradient(to right, #ff9966 0%, #ff5e62 51%, #ff9966 100%);
            box-shadow: 0 10px 20px rgba(255, 94, 98, 0.3);
        }

        .theme-orange:hover {
            box-shadow: 0 15px 30px rgba(255, 94, 98, 0.5);
        }

        .theme-green {
            background-image: linear-gradient(to right, #11998e 0%, #38ef7d 51%, #11998e 100%);
            box-shadow: 0 10px 20px rgba(56, 239, 125, 0.3);
        }

        .theme-green:hover {
            box-shadow: 0 15px 30px rgba(56, 239, 125, 0.5);
        }

        /* 클릭할 때 퍼져나가는 리플(Ripple) 애니메이션 요소 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear forwards;
            background-color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* 반응형 대응 */
        @media (max-width: 1024px) {
            h1 {
                font-size: 36px;
            }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 1.5rem;
                gap: 1.5rem;
            }

            header .logo {
                font-size: 1.5rem;
            }

            header .nav-menu {
                width: 100%;
                flex-direction: column;
                /* 메뉴들 세로로 쌓기 */
                align-items: center;
                gap: 1.2rem;
            }

            .container {
                padding: 4rem 2rem;
                width: 90%;
            }

            h1 {
                font-size: 32px;
                white-space: normal;
                word-break: keep-all;
            }

            p {
                font-size: 1.2rem;
            }

            .testimonial-section {
                padding: 4rem 1.5rem;
            }

            .testimonial-grid {
                flex-direction: column;
                /* 후기 카드 세로로 완전히 정렬 */
                align-items: center;
                width: 100%;
            }

            .testimonial-card {
                width: 100%;
                /* 모바일에서 좌우 너비 꽉 채우기 */
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <!-- 시각적 포인트를 주는 별 모양 아이콘 -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
            </svg>
            나의 첫 서비스
        </div>
        <nav class="nav-menu">
            <a href="#">소개</a>
            <a href="#">기능</a>
            <a href="#">문의</a>
        </nav>
    </header>

    <main>
        <!-- 첫 번째 구역: 핵심 기능 소개 -->
        <section class="hero-section">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>

            <div class="container">
                <h1>오늘도 힘내세요!</h1>
                <p>현대적이고 우아한 디자인으로 시작해보세요.</p>
                <button class="btn theme-blue" id="actionBtn">다음 문장 보기</button>
            </div>
        </section>

        <!-- 두 번째 구역: 사용자 후기 -->
        <section class="testimonial-section">
            <h2>사용자 후기</h2>
            <p class="section-subtitle">먼저 경험해본 유저들의 생생한 이야기를 들어보세요.</p>

            <div class="testimonial-grid">
                <!-- 후기 카드 1 -->
                <div class="testimonial-card">
                    <img src="./assets/user1.png" alt="사용자 프로필 1" class="profile-img">
                    <p class="quote-text">"매일 아침 이 페이지의 상쾌한 문구 덕분에 활기찬 하루를 시작합니다. 버튼을 클릭할 때마다 변하는 아름다운 컬러 테마도 너무 산뜻하고
                        마음에 쏙 듭니다!"</p>
                    <p class="author-name">- 제니퍼</p>
                </div>

                <!-- 후기 카드 2 -->
                <div class="testimonial-card">
                    <img src="./assets/user2.png" alt="사용자 프로필 2" class="profile-img">
                    <p class="quote-text">"단순히 용기를 주는 응원 문구 하나지만 글래스모피즘 효과 등 시각적인 완성도가 무척 뛰어나서 자꾸 들어오게 되네요. 아주 훌륭해요."
                    </p>
                    <p class="author-name">- 수잔</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        2026 My Service
    </footer>
    <script>
        const btn = document.getElementById('actionBtn');
        const mainTitle = document.querySelector('h1');

        // 4가지 응원 문구와 테마 정보 배열
        const sentences = [
            { text: '오늘도 힘내세요!', theme: 'theme-blue' },
            { text: '오늘도 해냈어요!', theme: 'theme-yellow' },
            { text: '조금씩 나아지고 있어요.', theme: 'theme-orange' },
            { text: '이대로 가봅시다.', theme: 'theme-green' }
        ];
        let currentIndex = 0;

        btn.addEventListener('click', function (e) {
            // 버튼 요소의 위치를 가져와 마우스 클릭 좌표 계산
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const ripples = document.createElement('span');
            ripples.style.left = x + 'px';
            ripples.style.top = y + 'px';

            // ripple 요소(원)의 크기를 버튼 크기에 맞춰 넉넉하게 설정
            const diameter = Math.max(rect.width, rect.height);
            ripples.style.width = diameter + 'px';
            ripples.style.height = diameter + 'px';
            ripples.style.marginLeft = -(diameter / 2) + 'px'; // 클릭 지점을 중심으로 정렬
            ripples.style.marginTop = -(diameter / 2) + 'px';

            ripples.classList.add('ripple');
            this.appendChild(ripples);

            // 0.6초 뒤 ripple 엘리먼트를 돔에서 제거
            setTimeout(() => {
                ripples.remove();
            }, 600);

            // 문장 및 테마 변경 로직: 차례대로 배열을 순환
            const oldTheme = sentences[currentIndex].theme;
            currentIndex = (currentIndex + 1) % sentences.length;
            const newTheme = sentences[currentIndex].theme;

            // 기존 테마 클래스 제거 후 새 테마 클래스 추가
            btn.classList.remove(oldTheme);
            btn.classList.add(newTheme);

            // 부드러운 페이드 효과 적용 (h1 요소의 transition 활용)
            mainTitle.style.opacity = 0;
            setTimeout(() => {
                mainTitle.textContent = sentences[currentIndex].text;
                mainTitle.style.opacity = 1;
            }, 200);
        });
    </script>
</body>

</html>
